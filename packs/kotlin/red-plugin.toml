schema_version = 1

[plugin]
id = "kotlin-language"
name = "Kotlin language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "Kotlin syntax highlighting, Gradle project detection, and Kotlin language server integration"
repository = "https://github.com/codersauce/red-language-packs"
license = "MIT"

[languages.kotlin]
extensions = ["kt", "kts"]
aliases = ["kotlin-script"]
comment = "// %s"
indent_width = 4

[languages.kotlin.grammar]
path = "grammars/kotlin.so"
symbol = "tree_sitter_kotlin"
highlights = [
    "queries/arborium-highlights.scm",
    "queries/highlights.scm",
]
indents = ["queries/indents.scm"]

[languages.kotlin.lsp]
command = "kotlin-language-server"
root_markers = ["settings.gradle.kts", "build.gradle.kts", "pom.xml", ".git"]

[languages.kotlin.formatter]
name = "ktlint"
command = "ktlint"
args = ["--format", "--stdin", "--stdin-path", "{file}", "--log-level=none"]
root_markers = ["settings.gradle.kts", "build.gradle.kts", "pom.xml", ".git"]
