schema_version = 1

[plugin]
id = "java-language"
name = "Java language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "Java syntax highlighting, Maven and Gradle project detection, and JDTLS integration"
repository = "https://github.com/codersauce/red-language-packs"
license = "MIT"

[languages.java]
extensions = ["java"]
aliases = ["jdk"]
comment = "// %s"
indent_width = 4

[languages.java.grammar]
path = "grammars/java.so"
symbol = "tree_sitter_java"
highlights = [
    "queries/arborium-highlights.scm",
    "queries/highlights.scm",
]
indents = ["queries/indents.scm"]

[languages.java.lsp]
command = "jdtls"
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts", ".git"]

[languages.java.formatter]
name = "google-java-format"
command = "google-java-format"
args = ["-"]
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts", ".git"]
