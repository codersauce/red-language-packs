schema_version = 1

[plugin]
id = "c-sharp-language"
name = "C# language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "C# syntax highlighting, .NET project detection, and C# language server integration"
repository = "https://github.com/codersauce/red-language-packs"
license = "MIT"

[languages.c-sharp]
extensions = ["cs", "csx"]
aliases = ["csharp", "c#"]
comment = "// %s"
indent_width = 4

[languages.c-sharp.grammar]
path = "grammars/c-sharp.so"
symbol = "tree_sitter_c_sharp"
highlights = [
    "queries/arborium-highlights.scm",
    "queries/highlights.scm",
]
indents = ["queries/indents.scm"]

[languages.c-sharp.lsp]
command = "csharp-ls"
root_markers = ["global.json", "Directory.Build.props", ".git"]

[languages.c-sharp.formatter]
name = "CSharpier"
command = "dotnet"
args = ["csharpier", "format", "--stdin-path", "{file}"]
root_markers = ["global.json", "Directory.Build.props", ".git"]
