schema_version = 1

[plugin]
id = "tmux-language"
name = "tmux language support"
version = "0.1.0"
red_api = "^0.10.0"
description = "tmux configuration syntax highlighting with embedded status formats and styles"
repository = "https://github.com/codersauce/red-language-packs"
license = "MIT"

[languages.tmux]
extensions = []
filenames = [".tmux.conf", "tmux.conf", ".tmux.conf.local", "tmux.conf.local"]
aliases = ["tmux-conf"]
comment = "# %s"
indent_width = 2

[languages.tmux.grammar]
path = "grammars/tmux.so"
symbol = "tree_sitter_tmux"
highlights = [
    "queries/highlights.scm",
]
injections = "queries/injections.scm"

[languages.tmuxf]
extensions = []
filenames = []
aliases = []

[languages.tmuxf.grammar]
path = "grammars/tmuxf.so"
symbol = "tree_sitter_tmuxf"
highlights = [
    "queries/tmuxf-highlights.scm",
]
