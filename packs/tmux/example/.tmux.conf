# Representative tmux configuration for Red.
set -g mouse on
set-option -g history-limit 10000
set -g @plugin 'tmux-plugins/tpm'
set -g @literal 'literal # text'
bind-key -n C-Space next-window
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind r source-file ~/.tmux.conf \; display-message "Reloaded #{session_name}"
set -g status-left '#[fg=green]#{session_name}#[default]'
set -g status-right \
  '#{?pane_in_mode,copy,#{pane_current_command}} %H:%M'
setw -g window-status-current-format "#[bold]#I:#W#[default]"
set -g automatic-rename-format '#{pane_current_command}'
set -g status-style 'fg=white,bg=black'
list-windows -F '#{window_index}:#{window_name}'
display-message '#{session_name}:#{window_index}'
if-shell -F '#{==:#{host},workstation}' 'display-message "work"'
run-shell 'printf "literal #{shell}"'
%if '#{==:#{host},workstation}'
  set -g status-position top
%elif '#{==:#{host},laptop}'
  set -g status-position bottom
%else
  set -g status off
%endif
set-hook -g after-new-window 'display-message "#{window_name}"'
set -g @theme2 dark
set -g status-format[0] '#{@theme2}:#{?#{==:#{host},workstation},work,home}'
set -g @plugin-format '#{literal}'
