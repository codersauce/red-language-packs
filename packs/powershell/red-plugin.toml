schema_version = 1

[plugin]
id = "powershell-language"
name = "PowerShell language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "PowerShell syntax highlighting, module detection, and PowerShell Editor Services integration"
repository = "https://github.com/codersauce/red-language-packs"
license = "MIT"

[languages.powershell]
extensions = ["ps1", "psm1", "psd1"]
aliases = ["ps1", "pwsh"]
comment = "# %s"
indent_width = 4

[languages.powershell.grammar]
path = "grammars/powershell.so"
symbol = "tree_sitter_powershell"
highlights = [
    "queries/arborium-highlights.scm",
    "queries/highlights.scm",
]
indents = ["queries/indents.scm"]

[languages.powershell.lsp]
command = "pwsh"
args = ["-NoLogo", "-NoProfile", "-Command", "Import-Module PowerShellEditorServices; Start-EditorServices -Stdio"]
root_markers = ["PSScriptAnalyzerSettings.psd1", "psakefile.ps1", ".git"]

[languages.powershell.formatter]
name = "PSScriptAnalyzer"
command = "pwsh"
args = ["-NoLogo", "-NoProfile", "-Command", "Import-Module PSScriptAnalyzer; Invoke-Formatter -ScriptDefinition ([Console]::In.ReadToEnd())"]
root_markers = ["PSScriptAnalyzerSettings.psd1", "psakefile.ps1", ".git"]
