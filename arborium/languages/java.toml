[package]
id = "java-language"
name = "Java language support"
version = "0.2.0"
red_api = "^0.10.0"
description = "Java syntax highlighting, Maven and Gradle project detection, and JDTLS integration"
license = "MIT"
catalog_tier = "official"

[language]
id = "java"
extensions = ["java"]
aliases = ["jdk"]
comment = "// %s"
indent_width = 4
symbol = "tree_sitter_java"
highlight_overlay = "queries/highlights.scm"
minimum_capture_scopes = ["function.method", "keyword", "string", "type", "type.builtin"]

[provenance]
copyright = ["Copyright (c) 2017 Ayman Nadeem"]

[lsp]
command = "jdtls"
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts", ".git"]
purpose = "Java completion, navigation, diagnostics, refactoring, and symbols"

[formatter]
name = "google-java-format"
command = "google-java-format"
args = ["-"]
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts", ".git"]
purpose = "Java source formatting"
documentation = "https://github.com/google/google-java-format"
setup = "Install google-java-format and ensure `google-java-format` is available on `PATH`."

[validation]
sample = "example/Greeter.java"
source = '''public class Greeter {
    public static void main(String[] args) {
        System.out.println("Hello from Red!");
    }
}
'''
required_captures = ["function.method", "keyword", "string", "type", "type.builtin"]
