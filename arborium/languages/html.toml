[package]
id = "html-language"
name = "HTML language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "HTML syntax highlighting, embedded CSS and JavaScript, and HTML language server integration"
license = "MIT"
catalog_tier = "official"

[language]
id = "html"
extensions = ["html", "htm", "xhtml"]
aliases = ["htm", "xhtml"]
comment = "<!-- %s -->"
indent_width = 2
symbol = "tree_sitter_html"
highlight_overlay = "queries/highlights.scm"
indent_queries = ["queries/indents.scm"]
minimum_capture_scopes = ["attribute", "punctuation.bracket", "string", "tag"]

[provenance]
copyright = ["Copyright (c) 2014 Max Brunsfeld"]

[lsp]
command = "vscode-html-language-server"
args = ["--stdio"]
root_markers = ["package.json", ".git"]
purpose = "HTML completion, diagnostics, hover documentation, and formatting"

[formatter]
name = "Prettier"
command = "prettier"
args = ["--stdin-filepath", "{file}"]
root_markers = ["package.json", ".git"]
purpose = "HTML formatting"
documentation = "https://prettier.io/docs/cli/"
setup = "Install Prettier locally or globally so `prettier` is available."

[validation]
sample = "example/index.html"
source = '''<!doctype html>
<html lang="en">
  <head>
    <style>body { color: #222; }</style>
  </head>
  <body class="greeting">
    <script>const greeting = "Hello from Red!";</script>
  </body>
</html>
'''
required_captures = ["attribute", "punctuation.bracket", "string", "tag"]
