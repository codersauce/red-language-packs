[package]
id = "c-language"
name = "C language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "C syntax highlighting, project detection, and clangd integration"
license = "MIT"
catalog_tier = "official"

[language]
id = "c"
extensions = ["c", "h"]
aliases = ["c11", "c17", "c23"]
comment = "// %s"
indent_width = 4
symbol = "tree_sitter_c"
highlight_overlay = "queries/highlights.scm"
indent_queries = ["queries/indents.scm"]
minimum_capture_scopes = ["function", "keyword", "string", "type"]

[provenance]
copyright = ["Copyright (c) 2014 Max Brunsfeld"]

[lsp]
command = "clangd"
root_markers = ["compile_commands.json", "compile_flags.txt", "CMakeLists.txt", ".git"]
purpose = "Hover, completion, navigation, diagnostics, formatting, and inlay hints"

[formatter]
name = "clang-format"
command = "clang-format"
args = ["--assume-filename", "{file}"]
root_markers = ["compile_commands.json", "compile_flags.txt", "CMakeLists.txt", ".git"]
purpose = "C source formatting"
documentation = "https://clang.llvm.org/docs/ClangFormat.html"
setup = "Install clang-format and ensure `clang-format` is available on `PATH`."

[validation]
sample = "example/main.c"
source = '''#include <stdio.h>

int main(void) {
    printf("Hello from Red!\n");
    return 0;
}
'''
required_captures = ["function", "keyword", "string", "type"]
