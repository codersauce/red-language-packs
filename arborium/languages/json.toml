[package]
id = "json-language"
name = "JSON language support"
version = "0.2.0"
red_api = "^0.10.0"
description = "JSON and JSONC syntax highlighting and JSON language server integration"
license = "MIT"
catalog_tier = "official"

[language]
id = "json"
extensions = ["json", "jsonc"]
aliases = ["jsonc"]
comment = "// %s"
indent_width = 2
symbol = "tree_sitter_json"
highlight_overlay = "queries/highlights.scm"
minimum_capture_scopes = ["comment", "constant.builtin", "escape", "number", "string", "string.special.key"]

[provenance]
copyright = ["Copyright (c) 2014 Max Brunsfeld"]

[lsp]
command = "vscode-json-language-server"
args = ["--stdio"]
root_markers = ["package.json", ".git"]
purpose = "JSON completion, schema-aware validation, hover documentation, and formatting"

[formatter]
name = "Prettier"
command = "prettier"
args = ["--stdin-filepath", "{file}"]
root_markers = ["package.json", ".git"]
purpose = "JSON formatting"
documentation = "https://prettier.io/docs/cli/"
setup = "Install Prettier locally or globally so `prettier` is available."

[validation]
sample = "example/settings.jsonc"
source = '''{
  // JSONC comments are supported alongside standard JSON values.
  "editor": {
    "fontFamily": "Red\u0020Mono",
    "fontSize": 14,
    "formatOnSave": true
  },
  "schema": null
}
'''
required_captures = ["comment", "constant.builtin", "escape", "number", "string", "string.special.key"]
