[package]
id = "c-sharp-language"
name = "C# language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "C# syntax highlighting, .NET project detection, and C# language server integration"
license = "MIT"
catalog_tier = "official"

[language]
id = "c-sharp"
grammar_name = "c_sharp"
extensions = ["cs", "csx"]
aliases = ["csharp", "c#"]
comment = "// %s"
indent_width = 4
symbol = "tree_sitter_c_sharp"
highlight_overlay = "queries/highlights.scm"
indent_queries = ["queries/indents.scm"]
minimum_capture_scopes = ["function", "keyword", "string", "type", "type.builtin"]

[provenance]
copyright = ["Copyright (c) 2014-2023 Max Brunsfeld, Damien Guard, Amaan Qureshi, and contributors."]

[lsp]
command = "csharp-ls"
root_markers = ["global.json", "Directory.Build.props", ".git"]
purpose = "Hover, completion, navigation, diagnostics, and symbols for .NET projects"

[formatter]
name = "CSharpier"
command = "dotnet"
args = ["csharpier", "format", "--stdin-path", "{file}"]
root_markers = ["global.json", "Directory.Build.props", ".git"]
purpose = "C# source formatting with CSharpier"
documentation = "https://csharpier.com/docs/CLI"
setup = "Install CSharpier as a global or local .NET tool so `dotnet csharpier` is available."

[validation]
sample = "example/Program.cs"
source = '''using System;

public class Greeter
{
    public static void Main()
    {
        Console.WriteLine("Hello from Red!");
    }
}
'''
required_captures = ["function", "keyword", "string", "type", "type.builtin"]
