[package]
id = "svelte-language"
name = "Svelte language support"
version = "0.3.0"
red_api = "^0.12.0"
description = "Svelte syntax highlighting, embedded JavaScript and CSS, and Svelte language server integration"
license = "MIT"
catalog_tier = "official"

[language]
id = "svelte"
extensions = ["svelte"]
aliases = ["svelte5"]
comment = "<!-- %s -->"
indent_width = 2
symbol = "tree_sitter_svelte"
highlight_overlay = "queries/highlights.scm"
indent_queries = ["queries/indents.scm"]
minimum_capture_scopes = ["attribute", "punctuation.bracket", "string", "tag"]

[provenance]
copyright = ["Copyright (c) 2024 Amaan Qureshi <amaanq12@gmail.com>"]

[lsp]
command = "svelteserver"
args = ["--stdio"]
root_markers = ["svelte.config.js", "svelte.config.ts", "package.json", ".git"]
purpose = "Svelte completion, diagnostics, component navigation, and formatting"

[formatter]
name = "Prettier Svelte"
command = "prettier"
args = ["--plugin=prettier-plugin-svelte", "--stdin-filepath", "{file}"]
root_markers = ["svelte.config.js", "svelte.config.ts", "package.json", ".git"]
purpose = "Svelte component formatting"
documentation = "https://github.com/sveltejs/prettier-plugin-svelte"
setup = "Install Prettier and `prettier-plugin-svelte` in the project or globally."

[validation]
sample = "example/App.svelte"
source = '''<script lang="ts">
  let greeting: string = "Hello from Red!";
</script>

<h1 class="greeting">{greeting}</h1>

<style>
  .greeting { color: red; }
</style>
'''
required_captures = ["attribute", "punctuation.bracket", "string", "tag"]
