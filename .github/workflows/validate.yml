name: Validate language packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.pack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [go, swift]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/validate_pack.py "packs/${{ matrix.pack }}"

  build-grammars:
    name: Build ${{ matrix.pack }} grammar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [go, swift]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Tree-sitter CLI
        run: cargo install tree-sitter-cli --version 0.25.10 --locked
      - run: sh "packs/${{ matrix.pack }}/build-grammar.sh"
      - run: python scripts/validate_pack.py "packs/${{ matrix.pack }}"

  go-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go test ./...
        working-directory: packs/go/example

  swift-example:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
        working-directory: packs/swift/example
