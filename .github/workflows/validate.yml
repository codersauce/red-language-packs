name: Validate language packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  arborium:
    name: Validate Arborium import policy
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.packs.outputs.packs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
        env:
          PYTHONPATH: scripts
      - run: python scripts/arborium.py inventory --check
      - run: python scripts/arborium.py sync --check
      - id: packs
        run: echo "packs=$(python scripts/arborium.py list --json)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.pack }}
    runs-on: ubuntu-latest
    needs: arborium
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.arborium.outputs.packs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/validate_pack.py "packs/${{ matrix.pack }}"

  build-grammars:
    name: Build all grammars on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: arborium
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Tree-sitter CLI
        run: cargo install tree-sitter-cli --version 0.25.10 --locked
      - run: python scripts/build_grammar.py --all
      - run: python scripts/validate_pack.py --all

  go-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go test ./...
        working-directory: packs/go/example

  swift-example:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
        working-directory: packs/swift/example
