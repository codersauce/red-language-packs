name: Release language pack

on:
  push:
    tags:
      - "go/v*"
      - "swift/v*"

permissions:
  contents: write

concurrency:
  group: language-pack-catalog
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve pack and host target
        id: release
        shell: bash
        run: |
          set -euo pipefail
          pack="${GITHUB_REF_NAME%%/*}"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$pack"
          test -n "$target"
          echo "pack=$pack" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Install pinned Tree-sitter CLI
        run: cargo install tree-sitter-cli --version 0.25.10 --locked
      - name: Build pinned grammar
        run: sh "packs/${{ steps.release.outputs.pack }}/build-grammar.sh"
      - name: Package release bundle
        run: >-
          python scripts/package_release.py
          "packs/${{ steps.release.outputs.pack }}"
          --target "${{ steps.release.outputs.target }}"
          --commit "$GITHUB_SHA"
          --tag "$GITHUB_REF_NAME"
          --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish immutable pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes

  catalog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Load the last published catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          if ! gh release download catalog-v1 --pattern v1.json --dir base; then
            cp catalog/v1.json base/v1.json
          fi
      - name: Merge released targets
        run: >-
          python scripts/merge_catalog.py
          --base base/v1.json
          --metadata dist/catalog-*.json
          --output dist/v1.json
      - name: Publish the stable catalog asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view catalog-v1 >/dev/null 2>&1; then
            gh release upload catalog-v1 dist/v1.json --clobber
          else
            gh release create catalog-v1 dist/v1.json \
              --target "$GITHUB_SHA" \
              --title "Red language pack catalog v1" \
              --notes "Machine-readable catalog consumed by Red. Native grammar approval remains explicit."
          fi
